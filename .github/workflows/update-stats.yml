name: Update Portfolio Stats

on:
  schedule:
    # Run daily at 2 AM UTC (8 PM MT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: gh-pages-md
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Run stats collection script
      run: |
        python3 fetch_all_stats.py
    
    - name: Move stats to assets folder
      run: |
        mkdir -p assets
        cp portfolio_stats.json assets/portfolio_stats.json
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add assets/portfolio_stats.json
        git diff --staged --quiet || (git commit -m "Update portfolio stats [skip ci]" && git push)
