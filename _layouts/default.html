<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="icon" href="{{ site.baseurl }}/assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <script>
    // Apply saved theme immediately to prevent flash
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  {% include header.html %}
  <main class="page-content">
    <div class="container">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
  <script>
    // Dark mode toggle — 3-way: auto / light / dark
    (function() {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;

      var states = ['auto', 'light', 'dark'];
      var saved = localStorage.getItem('theme');
      var current = states.indexOf(saved) !== -1 ? saved : 'auto';

      function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyTheme(mode) {
        var effective = mode === 'auto' ? getSystemTheme() : mode;
        document.documentElement.setAttribute('data-theme', effective);
      }

      applyTheme(current);

      btn.addEventListener('click', function() {
        var idx = states.indexOf(current);
        current = states[(idx + 1) % states.length];
        localStorage.setItem('theme', current);
        applyTheme(current);
      });

      // Listen for system theme changes when in auto mode
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
        if (current === 'auto') {
          applyTheme('auto');
        }
      });
    })();

    // Mobile nav toggle
    (function() {
      var toggle = document.querySelector('.nav-toggle');
      var nav = document.querySelector('.site-header__nav-links');
      if (!toggle || !nav) return;

      toggle.addEventListener('click', function() {
        nav.classList.toggle('site-header__nav-links--open');
      });
    })();
  </script>
</body>
</html>
