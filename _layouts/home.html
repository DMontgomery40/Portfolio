<style>
/* Home-specific styles */
.main-content {
    margin-top: 0;
}

.hero-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 20% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.1) 0%, transparent 50%);
}

.hero-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.1) 0%, transparent 50%);
}

.hero-particles {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(2px 2px at 20px 30px, var(--primary), transparent),
        radial-gradient(2px 2px at 40px 70px, var(--accent), transparent),
        radial-gradient(1px 1px at 90px 40px, var(--secondary), transparent);
    background-repeat: repeat;
    background-size: 150px 150px;
    animation: float 10s infinite linear;
    opacity: 0.3;
}

@keyframes float {
    0% { transform: translateY(0px) rotate(0deg); }
    100% { transform: translateY(-20px) rotate(360deg); }
}

.hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
}

.hero-title {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 700;
    margin-bottom: 1rem;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: slideInUp 1s ease-out;
}

.hero-subtitle {
    font-size: clamp(1.2rem, 4vw, 2rem);
    color: var(--text-secondary);
    margin-bottom: 2rem;
    animation: slideInUp 1s ease-out 0.2s both;
}

.hero-description {
    font-size: 1.2rem;
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto 3rem;
    animation: slideInUp 1s ease-out 0.4s both;
}

.cta-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: slideInUp 1s ease-out 0.6s both;
}

.typing-text {
    border-right: 2px solid var(--primary);
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 50% { border-color: var(--primary); }
    51%, 100% { border-color: transparent; }
}

.stats-section {
    padding: 4rem 0;
    background: var(--bg-card);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 2rem;
}

.stat-card {
    text-align: center;
    padding: 2rem;
    background: var(--bg-hover);
    border-radius: 15px;
    border: 1px solid var(--border);
    transition: all 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow);
    border-color: var(--primary);
}

.stat-number {
    font-size: 2.5rem;
    font-weight: 700;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
}

.stat-label {
    color: var(--text-primary);
    font-weight: 600;
    margin-bottom: 0.5rem;
}

.stat-description {
    color: var(--text-muted);
    font-size: 0.9rem;
}

.featured-projects,
.latest-articles,
.skills-overview,
.quick-links {
    padding: 6rem 0;
}

.latest-articles {
    background: var(--bg-card);
}

.project-icon,
.article-icon,
.skill-icon,
.quick-link-icon {
    width: 60px;
    height: 60px;
    background: var(--gradient);
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
    color: var(--bg-dark);
}

.project-title,
.article-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--text-primary);
}

.project-description,
.article-excerpt {
    color: var(--text-secondary);
    margin-bottom: 1.5rem;
    line-height: 1.6;
}

.project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
}

.tag {
    background: rgba(0, 245, 255, 0.1);
    color: var(--primary);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    border: 1px solid rgba(0, 245, 255, 0.2);
}

.project-links {
    display: flex;
    gap: 1rem;
}

.article-meta {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    color: var(--text-muted);
}

.skill-category ul {
    list-style: none;
    padding: 0;
}

.skill-category li {
    color: var(--text-secondary);
    margin-bottom: 0.5rem;
    position: relative;
    padding-left: 1.5rem;
}

.skill-category li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--primary);
}

.quick-link-card {
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: all 0.3s ease;
}

.quick-link-card:hover {
    color: inherit;
    text-decoration: none;
}

.quick-link-arrow {
    position: absolute;
    top: 1rem;
    right: 1rem;
    color: var(--primary);
    transition: transform 0.3s ease;
}

.quick-link-card:hover .quick-link-arrow {
    transform: translateX(5px);
}

@media (max-width: 768px) {
    .hero-section {
        min-height: 80vh;
        padding: 2rem 0;
    }

    .hero-title {
        font-size: clamp(2rem, 8vw, 2.8rem);
        margin-bottom: 1rem;
        line-height: 1.1;
    }

    .hero-subtitle {
        font-size: clamp(1rem, 4vw, 1.4rem);
        margin-bottom: 1.5rem;
    }

    .hero-description {
        font-size: 1rem;
        margin-bottom: 2rem;
        padding: 0 1rem;
    }
    
    .cta-buttons {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 0 1rem;
    }

    .cta-buttons .btn {
        width: 100%;
        max-width: 280px;
        justify-content: center;
        padding: 1rem 1.5rem;
        font-size: 1rem;
    }
    
    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
    }

    .stat-card {
        padding: 1.5rem 1rem;
    }

    .stat-number {
        font-size: 2rem;
    }

    .stat-label {
        font-size: 0.9rem;
    }

    .stat-description {
        font-size: 0.8rem;
    }

    .featured-projects,
    .latest-articles,
    .skills-overview,
    .quick-links {
        padding: 3rem 0;
    }

    .section-title {
        font-size: 2.2rem;
        margin-bottom: 0.8rem;
    }

    .section-subtitle {
        font-size: 1rem;
        margin-bottom: 2.5rem;
        padding: 0 1rem;
    }

    .project-card,
    .article-card,
    .skill-category,
    .quick-link-card {
        padding: 1.5rem;
    }

    .project-icon,
    .article-icon,
    .skill-icon,
    .quick-link-icon {
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
        margin-bottom: 1rem;
    }

    .project-title,
    .article-title {
        font-size: 1.3rem;
        margin-bottom: 0.8rem;
    }

    .project-description,
    .article-excerpt {
        font-size: 0.95rem;
        margin-bottom: 1rem;
        line-height: 1.5;
    }

    .project-tags {
        justify-content: center;
        margin-bottom: 1.2rem;
    }

    .tag {
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
    }

    .project-links {
        flex-direction: column;
        gap: 0.75rem;
    }

    .project-links .btn {
        width: 100%;
        justify-content: center;
    }

    .article-meta {
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.85rem;
    }

    .skill-category ul {
        text-align: center;
    }

    .skill-category li {
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
    }

    .quick-link-arrow {
        position: static;
        margin-top: 1rem;
        text-align: center;
    }
}

/* Small mobile phones - Homepage specific */
@media (max-width: 480px) {
    .hero-section {
        min-height: 70vh;
        padding: 1rem 0;
    }

    .hero-title {
        font-size: 1.8rem;
        margin-bottom: 0.8rem;
    }

    .hero-subtitle {
        font-size: 1rem;
        margin-bottom: 1.2rem;
    }

    .hero-description {
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
    }

    .stats-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
    }

    .stat-card {
        padding: 1.2rem 1rem;
    }

    .section-title {
        font-size: 1.8rem;
    }

    .section-subtitle {
        font-size: 0.9rem;
        margin-bottom: 2rem;
    }

    .project-card,
    .article-card,
    .skill-category,
    .quick-link-card {
        padding: 1.2rem;
    }

    .project-icon,
    .article-icon,
    .skill-icon,
    .quick-link-icon {
        width: 45px;
        height: 45px;
        font-size: 1.2rem;
    }

    .project-title,
    .article-title {
        font-size: 1.2rem;
    }

    .project-description,
    .article-excerpt {
        font-size: 0.9rem;
    }
}
</style>

<script>
// Typing effect
const typingText = document.getElementById('typing-text');
if (typingText) {
    const texts = ['Security Researcher', 'AI Engineer', 'System Architect', 'Open Source Contributor'];
    let textIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function typeText() {
        const currentText = texts[textIndex];
        
        if (isDeleting) {
            typingText.textContent = currentText.substring(0, charIndex - 1);
            charIndex--;
        } else {
            typingText.textContent = currentText.substring(0, charIndex + 1);
            charIndex++;
        }

        let typeSpeed = isDeleting ? 50 : 100;

        if (!isDeleting && charIndex === currentText.length) {
            typeSpeed = 2000;
            isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
            isDeleting = false;
            textIndex = (textIndex + 1) % texts.length;
            typeSpeed = 500;
        }

        setTimeout(typeText, typeSpeed);
    }
    
    typeText();
}

// Counter animation
function animateCounters() {
    const counters = document.querySelectorAll('.stat-number');
    
    counters.forEach(counter => {
        const target = parseInt(counter.getAttribute('data-count'));
        const duration = 2000;
        const increment = target / (duration / 16);
        let current = 0;
        
        const updateCounter = () => {
            if (current < target) {
                current += increment;
                counter.textContent = Math.floor(current);
                requestAnimationFrame(updateCounter);
            } else {
                counter.textContent = target;
            }
        };
        
        updateCounter();
    });
}

// Fetch and display aggregate stats only
async function fetchPortfolioStats() {
    try {
        // Fetch the stats JSON file
        const response = await fetch('{{ site.baseurl }}/assets/portfolio_stats.json');
        const stats = await response.json();
        
        // Update the stat cards with actual data
        const downloads = stats.totals.downloads;
        const stars = stats.github.total_stars;
        const packages = stats.totals.packages;
        const forks = stats.github.total_forks;
        
        // Set the data-count attributes for animation
        document.getElementById('total-downloads').setAttribute('data-count', downloads);
        document.getElementById('github-stars').setAttribute('data-count', stars);
        document.getElementById('total-packages').setAttribute('data-count', packages);
        document.getElementById('github-forks').setAttribute('data-count', forks);
        
        // Update the timestamp
        const updateTime = new Date(stats.timestamp);
        const timeAgo = getTimeAgo(updateTime);
        document.getElementById('stats-update-time').textContent = `Live stats updated ${timeAgo}`;
        
    } catch (error) {
        console.error('Error loading stats:', error);
        // Fall back to some reasonable defaults
        document.getElementById('total-downloads').setAttribute('data-count', 45000);
        document.getElementById('github-stars').setAttribute('data-count', 600);
        document.getElementById('total-packages').setAttribute('data-count', 85);
        document.getElementById('github-forks').setAttribute('data-count', 120);
        document.getElementById('stats-update-time').textContent = 'Stats temporarily unavailable';
    }
}

// Helper function to get "time ago" string
function getTimeAgo(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    const days = Math.floor(seconds / 86400);
    if (days > 1) return `${days} days ago`;
    if (days === 1) return 'yesterday';
    const hours = Math.floor(seconds / 3600);
    if (hours > 1) return `${hours} hours ago`;
    if (hours === 1) return 'an hour ago';
    return 'just now';
}

// Initialize animations when stats section comes into view
document.addEventListener('DOMContentLoaded', function() {
    // First fetch the real stats
    fetchPortfolioStats().then(() => {
        // Then set up the observer for animation
        const statsObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    animateCounters();
                    statsObserver.unobserve(entry.target);
                }
            });
        });
        
        const statsSection = document.querySelector('.stats-section');
        if (statsSection) {
            statsObserver.observe(statsSection);
        }
    });
});
</script>
