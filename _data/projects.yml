- name: "Ragweld"
  slug: "ragweld"
  description: "Open-source MLOps platform for API-first RAG and agent systems with versioned config, tri-hybrid retrieval, and MCP integration."
  long_description: |
    Ragweld is a full-stack MLOps platform for building and operating RAG (Retrieval-Augmented Generation) and agent systems. It runs three retrieval methods in parallel -- vector search via pgvector, sparse BM25 search via PostgreSQL FTS, and graph traversal via Neo4j -- then fuses their results with reciprocal rank fusion and optional reranking.

    The platform is API-first with independent model/provider routing for API, chat, CLI, and MCP channels. It includes a Synthetic Data Lab, dual training studios (learning reranker + in-product agent model), an evaluation workbench with run diffs, and built-in tracing and observability with Grafana/Loki integration. All configuration is Pydantic-backed and versioned, with 500+ tunable parameters exposed via both UI and API.

    Ragweld also ships an embedded MCP server on Streamable HTTP, a knowledge graph with automatic entity extraction and community detection, semantic cache with recall gates, and manifest-backed training artifact workflows with provenance tracking.
