- name: "Acoustic Momentum"
  slug: "acoustic-momentum"
  description: "Weakly-supervised real-time crowd audio classifier for in-play sports pricing, achieving 12ms inference on Apple Silicon."
  long_description: |
    Acoustic Momentum turns raw stadium crowd audio into an Attack Pressure Index -- a continuous [0,1] signal that fires during dangerous attacks, near-misses, and high-entropy game moments. The model is trained entirely from match audio plus goal timestamps via weak supervision, requiring no manual frame-by-frame annotation. This approach scales to thousands of hours of archive footage automatically using StatsBomb open data.

    The architecture is a mel spectrogram pipeline feeding an ANE-optimized depthwise-separable CNN encoder into a BiLSTM temporal head, achieving 12ms end-to-end inference on Apple Silicon. The system uses a sliding window of 15 spectrograms (38 seconds of audio history) with strict causal time alignment -- predictions are timestamped at the end of the last processed window, never using future audio.

    The project includes a Streamlit dashboard with ingest, training, and live monitoring tabs. The live mode accepts microphone input for real-time at-venue detection. The project honestly analyzes which market tiers (lower leagues over Premier League) and which strategies (fade over front-run, citing +4.1% per match from academic research) are realistically exploitable.
  github_url: "https://github.com/DMontgomery40/acoustic-momentum"
