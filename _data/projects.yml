- name: "Bambu Printer MCP"
  slug: "bambu-printer-mcp"
  description: "MCP server for controlling Bambu Lab 3D printers -- STL manipulation, auto-slicing, FTPS upload, and MQTT print control from Claude."
  long_description: |
    bambu-printer-mcp is a Model Context Protocol server that gives Claude Desktop, Claude Code, or any MCP client direct control over Bambu Lab 3D printers. It handles the full print workflow: manipulate an STL (scale, rotate, merge, flatten), auto-slice with BambuStudio CLI, upload the resulting 3MF over FTPS, and start the print via MQTT -- all without leaving a conversation.

    The server provides detailed printer status (temperatures, progress, layers, AMS slot data), file management via FTPS, and print job control. It correctly parses AMS mapping from 3MF slicer config and sends it per the OpenBambuAPI spec. Multiple slicer backends are supported: BambuStudio, OrcaSlicer, PrusaSlicer, Cura, and Slic3r. An optional Blender MCP bridge enables advanced mesh operations.

    This is a focused Bambu-only fork of the broader mcp-3D-printer-server project, stripped to its Bambu core for a smaller, faster install. It supports dual transport (stdio for Claude Desktop/Code, Streamable HTTP for other clients) and is published on npm for instant use via npx.
