- name: "Cathode"
  slug: "cathode"
  description: "Local-first explainer video pipeline with React/FastAPI control room, MCP server, and Remotion-backed motion rendering."
  long_description: |
    Cathode is a local-first video generation pipeline that turns rough notes, source text, or a finished script into a rendered MP4 through four operator lanes: a React/FastAPI control room, a legacy Streamlit app, an MCP server for agent-driven runs, and a live product demo capture workflow.

    The pipeline supports three composition modes -- classic (image + video with ffmpeg), hybrid (mixed media with Remotion), and motion-only (template-driven motion scenes). Narration audio drives all timing, keeping scenes synchronized across render backends. Cathode is env-driven with pluggable providers for storyboard generation, image creation, TTS, and video rendering, including local options like Kokoro TTS, Qwen image generation on MLX, and local video backends.

    The live demo lane uses Playwright to capture real running applications, with a structured QC review loop where a sub-agent evaluates extracted frames before the final render. All project state, storyboards, and job logs persist locally under a plan.json source of truth.
