- name: "Faxbot"
  slug: "faxbot"
  description: "Open-source, self-hostable fax platform with GUI-first Admin Console, multi-backend adapters, MCP integration, and iOS companion app."
  long_description: |
    Faxbot is the first and only open-source, self-hostable fax platform with a GUI-first Admin Console. It supports over 20 provider backends -- cloud services like Phaxio, Documo, Sinch, and SignalWire, plus self-hosted options like FreeSWITCH and SIP/Asterisk -- with full freedom to mix and match outbound and inbound providers.

    The platform includes HIPAA-aligned controls with HMAC webhook verification, short-TTL tokens, and compliant logging with no PHI in logs. It ships official MCP servers in both Node and Python for stdio/HTTP/SSE transport, enabling AI assistant integration. Identical SDKs are published for both Node.js (npm install faxbot) and Python (pip install faxbot).

    Faxbot also has an iOS companion app for sending faxes and checking status from mobile, with the traits-first UI architecture ensuring screens render only what the active provider supports. The Admin Console provides one-stop configuration for backends, keys, inbound settings, storage, and diagnostics.
