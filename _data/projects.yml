- name: "TTT SSM Eval"
  slug: "ttt-ssm-eval"
  description: "Safety research infrastructure for Test-Time Training with external safety gates, canary rollback, and wake/sleep consolidation."
  long_description: |
    ttt_ssm_eval is research infrastructure for studying how to make Test-Time Training safe. In standard transformers, garbage in means garbage out; in TTT, garbage in means garbage learned. The repo implements safety checks deliberately outside the computation graph -- gradients cannot flow through regex gates, making them immune to gradient-based bypass attacks.

    The architecture stacks four defense layers with different failure modes: a fast static gate for known attack patterns and entropy anomalies, dynamic canary probes for catastrophic corruption, a slow auditor for cross-session pattern detection, and human review. The system implements complementary learning inspired by biological memory: fast context weights update per-session (hippocampus), core model weights are frozen during inference (neocortex), and offline sleep consolidation replays filtered chat traces into the core model.

    The repo includes three domains: a Nano SSM with branchable plastic matrices and system identification benchmarks, a TTT Sentry monitor with instrumented safety loops, and a TinyLM chat system with per-session fast weights trained via Muon optimizer. A React dashboard provides real-time observation of all safety mechanisms across domains.
  github_url: "https://github.com/DMontgomery40/ttt_ssm_eval"
  live_url: ""
  tech_stack:
