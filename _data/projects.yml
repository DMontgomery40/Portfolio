    Football Tactical Workbench is a browser-first analysis and detector fine-tuning platform built with React and FastAPI. It has three top-level surfaces: an Analysis Workspace for loading clips, streaming live preview, and reviewing overlay/diagnostics; a Training Studio for scanning YOLO datasets, fine-tuning from the football-pretrained soccana detector, and managing checkpoints; and a Benchmark Lab for running suite-by-recipe benchmark matrices across detectors and pipelines.

    The active analysis pipeline uses soccana for player/referee/ball detection, hybrid appearance-aware tracking with tracklet stitching, jersey-colour home/away separation, soccana_keypoint field registration with automatic pitch calibration refresh every 10 frames, and live browser preview. Training runs in isolated Python subprocesses with full config, logs, and artifact persistence.

    The Benchmark Lab supports first-class recipes including detector:soccana, pipeline:soccermaster, and pipeline:tracklab-sn-gamestate, with matrix-synced charts and explicit handling of blocked or unsupported suite cells. On Apple Silicon, detector inference uses MPS while field calibration falls back to CPU.
