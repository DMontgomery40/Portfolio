- name: "Ragweld Crucible"
  slug: "ragweld-crucible"
  description: "Operator range planner for estimating training cost, VRAM fit, and GPU availability across providers."
  long_description: |
    Crucible is the estimator workbench behind ragweld.com/crucible. It combines model metadata, hardware reference data, provider pricing, and planning heuristics so operators can compare likely training ranges before committing a run.

    The front-end is a React + TypeScript + Vite application with estimator logic, normalization rules, and planner math in a dedicated engine module. It ships with reference datasets for model catalogs, GPU specs, and pricing fallback data, plus a math code workbench route for inspecting the implementation behind the planner.

    This repository is a public mirror of the crucible subtree from the larger ragweld.com site repo, containing the full front-end app, estimator logic, data catalogs, and tests. The live production surface also depends on Netlify Functions from the parent repo.
