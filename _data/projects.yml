- name: "GaitSignal"
  slug: "gaitsignal"
  description: "Live football pricing-edge concept demo using player-specific movement surprise and venue-grade tracking for in-play market information."
  long_description: |
    GaitSignal is a synthetic React prototype demonstrating how contracted in-stadium player tracking combined with player-specific movement models could surface in-play pricing edges before standard market digestion. The core thesis is that per-player temporal models with prediction-surprise scoring, gated by football context (possession, ball access, pitch zone, role demand), reveal commercially relevant signals that universal thresholds miss.

    The demo generates synthetic 20-feature biomechanical vectors, player-specific movement-surprise proxies, and venue-style football context streams. The UI is organized like a live trading desk with panels for match state, player motion lens, pricing workflow timeline, and in-play pricing edge states. Three scenarios -- Saka recovery-run reprice, Pedri press-decay edge, and Musiala contact reset -- demonstrate different signal patterns.

    This is the companion concept to Acoustic Momentum: one modality from the player, one from the crowd. Both explore in-play information that the market may not yet fully price.
