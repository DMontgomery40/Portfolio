# _config.yml - GitHub Pages Compatible
title: David Montgomery - Full Stack Developer & Security Researcher
description: Building the backend, securing the stack, and making AI accessible to everyone
url: https://dmontgomery40.github.io
baseurl: "/Portfolio"

# Author information
author:
  name: David Montgomery
  email: contact@securitylens.io
  github: DMontgomery40
  linkedin: dmontgomery40
  medium: dmontg

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# GitHub Pages safe plugins only
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-github-metadata
  - jekyll-relative-links

# Collections (simplified for GitHub Pages)
collections:
  projects:
    output: true
    permalink: /projects/:name/
  articles:
    output: true
    permalink: /articles/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Navigation (simple array for GitHub Pages)
navigation:
  - name: Home
    url: /
  - name: Projects
    url: /Projects/
  - name: Articles  
    url: /articles/
  - name: Homelab
    url: /Homelab/
  - name: Resume
    url: /Resume/

# Social links
social:
  github: https://github.com/DMontgomery40
  linkedin: https://linkedin.com/in/dmontgomery40
  medium: https://medium.com/@dmontg
  email: contact@securitylens.io

# SEO settings
google_analytics: # Add your GA tracking ID if you have one

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - .gitignore
  - "*.sh"

# Markdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Sass settings (GitHub Pages compatible)
sass:
  style: compressed

# Timezone
timezone: America/Denver

# GitHub Pages settings
github: [metadata]
repository: DMontgomery40/Portfolio