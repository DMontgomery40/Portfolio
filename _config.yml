title: David Montgomery
description: AI Innovation & Systems Engineer — RAG Platforms, Computer Vision, MCP Integrations
url: https://dmontgomery40.github.io
baseurl: "/Portfolio"
favicon: "/Portfolio/assets/favicon.ico"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: "Homelab"
    values:
      layout: "default"
  - scope:
      path: "Gists"
    values:
      layout: "default"
  - scope:
      path: "Resume"
    values:
      layout: "default"

# Build
markdown: kramdown
kramdown:
  parse_block_html: true

plugins:
  - jekyll-seo-tag

footer_links:
  github: https://github.com/DMontgomery40
  linkedin: https://www.linkedin.com/in/david-montgomery-5a07656b/
  medium: https://medium.com/@dmontg
  npm: https://www.npmjs.com/~dmontgomery40

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .DS_Store
  - Projects/html_backup
