title: David Montgomery
remote_theme: just-the-docs/just-the-docs
description: A collection of various development projects and tools
url: https://dmontgomery40.github.io/Portfolio/
baseurl: "/Portfolio"
favicon: "/Portfolio/assets/favicon.ico"

aux_links:
  "View on GitHub":
    - "https://github.com/DMontgomery40/Portfolio"

color_scheme: dark

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

plugins:
  - jekyll-remote-include

# Enable copy button on code blocks
enable_copy_code_button: true

# Enable anchors on headings
heading_anchors: true

# Footer content
footer_content: "Copyright &copy; 2025 David Montgomery."

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/
  articles:
    output: true
    permalink: /articles/:title/
  homelab:
    output: true
    permalink: /homelab/:title/
  storytime:
    output: true
    permalink: /storytime/:title/
  resume:
    output: true
    permalink: /resume/:title/
  other:
    output: true
    permalink: /other/:title/
  # Add other collections if needed


# Default values
defaults:
  -
    scope:
      path: "/Portfolio"
      type: "projects"
    values:
      layout: "project"
  -
    scope:
      path: "/Portfolio"
      type: "articles"
    values:
      layout: "default"
  -
    scope:
      path: "/Portfolio"
      type: "homelab"
    values:
      layout: "default"
  -
    scope:
      path: "/Portfolio"
      type: "storytime"
    values:
      layout: "default"
  -
    scope:
      path: "/Portfolio"
      type: "resume"
    values:
      layout: "default"
  -
    scope:
      path: "/Portfolio"
      type: "other"
    values:
      layout: "default"

callouts:
  note:
    title: Note
    color: white
  tip:
    title: Tip
    color: white
  warning:
    title: Warning
    color: white

gh_edit_link: false

search_enabled: true

kramdown:
  parse_block_html: true

heading_anchors: true
